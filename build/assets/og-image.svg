<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141c24"/>
      <stop offset="60%" stop-color="#1d3d47"/>
      <stop offset="100%" stop-color="#0e151a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#7fb3bb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7fb3bb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Geometric Accent -->
  <circle cx="950" cy="315" r="220" fill="none" stroke="#b0d0d5" stroke-width="2" opacity="0.3"/>
  <circle cx="950" cy="315" r="160" fill="none" stroke="#2f6f7c" stroke-width="20" opacity="0.25"/>
  <circle cx="950" cy="315" r="80" fill="#7fb3bb" opacity="0.15"/>

  <!-- Badge / Eyebrow -->
  <rect x="90" y="110" width="280" height="38" rx="19" fill="#244b58" stroke="#3d6f7e" stroke-width="1.5"/>
  <text x="230" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#a4dbe3" text-anchor="middle" letter-spacing="2">PORTLAND · WEDDINGS</text>

  <!-- Main Headline -->
  <text x="90" y="235" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#f4fdff" letter-spacing="-1">Meridian Studios</text>
  <text x="90" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#c3d7dc">Considered wedding photography &amp; cinematic films.</text>

  <!-- Meta Badges -->
  <g transform="translate(90, 410)">
    <rect width="210" height="54" rx="12" fill="#18232c" stroke="#2c3a46" stroke-width="1"/>
    <text x="24" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#ffd479">★ 4.8</text>
    <text x="82" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#8ca0aa">474 Reviews</text>
  </g>

  <g transform="translate(320, 410)">
    <rect width="220" height="54" rx="12" fill="#18232c" stroke="#2c3a46" stroke-width="1"/>
    <text x="24" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#5ed69a">✓ Verified Studio</text>
    <text x="150" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#8ca0aa">Portland</text>
  </g>

  <!-- Bottom Branding -->
  <text x="90" y="540" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="500" fill="#7fb3bb">meridianstudios.example · Bookings Open for 2026/2027</text>
</svg>